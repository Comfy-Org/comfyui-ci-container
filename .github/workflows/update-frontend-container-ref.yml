name: "Update Frontend Container Reference"

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      FRONTEND_PAT:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Container version (defaults to the latest release from main)'
        required: false
        type: string

jobs:
  update-frontend:
    runs-on: ubuntu-latest
    if: github.repository == 'Comfy-Org/comfyui-ci-container'
    permissions:
      actions: read
      contents: read
      packages: read
    timeout-minutes: 60
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve container version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          RAW_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 3300))
          image="${IMAGE,,}"
          wait_or_timeout() {
            if (( SECONDS >= deadline )); then
              echo 'Timed out waiting for the container release' >&2
              exit 1
            fi
            sleep 15
          }
          wait_for_image() {
            until docker buildx imagetools inspect "$image:$version" >/dev/null 2>&1; do
              echo "Waiting for $image:$version"
              wait_or_timeout
            done
          }

          version="${RAW_VERSION#v}"
          if [[ -n "$version" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid container version: $RAW_VERSION" >&2
            exit 1
          fi

          if [[ -z "$version" ]]; then
            while true; do
              target_sha=''
              while true; do
                main_sha=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
                if [[ "$main_sha" != "$target_sha" ]]; then
                  target_sha="$main_sha"
                  echo "Waiting for the release from main commit ${target_sha:0:7}"
                fi

                run=$(gh api --method GET \
                  "repos/$REPOSITORY/actions/workflows/build-and-push.yml/runs" \
                  -f branch=main -f event=push -f per_page=100 |
                  jq -r --arg sha "$target_sha" '
                    .workflow_runs
                    | map(select(.head_sha == $sha))
                    | sort_by(.run_number)
                    | last
                    | select(. != null)
                    | [.id, .status, .html_url]
                    | @tsv
                  ')
                if [[ -z "$run" ]]; then
                  commit_message=$(gh api "repos/$REPOSITORY/commits/$target_sha" --jq .commit.message)
                  if grep -Eiq '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]' <<< "$commit_message" ||
                    git interpret-trailers --parse <<< "$commit_message" |
                      grep -Eiq '^skip-checks:[[:space:]]*true$'; then
                    echo "Commit ${target_sha:0:7} skips Actions. Push a new commit or provide an explicit published version." >&2
                    exit 1
                  fi
                  echo 'The release workflow has not started yet'
                  wait_or_timeout
                  continue
                fi

                IFS=$'\t' read -r run_id run_status run_url <<< "$run"
                build=$(gh api "repos/$REPOSITORY/actions/runs/$run_id/jobs" |
                  jq -r '.jobs[] | select(.name == "build") | [.status, .conclusion] | @tsv' |
                  head -n 1)
                if [[ -z "$build" ]]; then
                  if [[ "$run_status" == 'completed' ]]; then
                    echo "The release workflow completed without a build job: $run_url" >&2
                    exit 1
                  fi
                  echo 'The build job has not started yet'
                  wait_or_timeout
                  continue
                fi

                IFS=$'\t' read -r build_status build_conclusion <<< "$build"
                if [[ "$build_status" != 'completed' ]]; then
                  echo "The build job is $build_status"
                  wait_or_timeout
                  continue
                fi
                if [[ "$build_conclusion" != 'success' ]]; then
                  echo "The build job did not succeed: $run_url" >&2
                  exit 1
                fi

                latest_main_sha=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
                if [[ "$latest_main_sha" != "$target_sha" ]]; then
                  echo 'A newer commit reached main; waiting for its release'
                  target_sha=''
                  continue
                fi

                version=$(
                  gh api --paginate --slurp \
                    "repos/$REPOSITORY/tags?per_page=100" |
                    jq -r --arg sha "$target_sha" \
                      'add[]
                      | select(.commit.sha == $sha)
                      | .name
                      | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' |
                    sort -V |
                    tail -n 1
                )
                version="${version#v}"
                if [[ -n "$version" ]]; then
                  break
                fi

                echo 'The release tag is not available yet'
                wait_or_timeout
              done

              wait_for_image
              latest_main_sha=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
              if [[ "$latest_main_sha" == "$target_sha" ]]; then
                break
              fi

              echo 'A newer commit reached main while waiting for the image; waiting for its release'
              version=''
            done
          else
            wait_for_image
          fi

          echo "Using $image:$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout ComfyUI_frontend
        uses: actions/checkout@v7
        with:
          repository: Comfy-Org/ComfyUI_frontend
          token: ${{ secrets.FRONTEND_PAT }}

      - name: Get current version
        id: current
        run: |
          CURRENT=$(grep -oP 'comfyui-ci-container:\K[0-9]+\.[0-9]+\.[0-9]+' .github/workflows/ci-tests-e2e.yaml | head -1 || true)
          if [ -z "$CURRENT" ]; then
            echo 'Could not determine the current frontend container version' >&2
            exit 1
          fi
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Update container references
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          files=(
            .github/workflows/ci-tests-e2e.yaml
            .github/workflows/ci-perf-report.yaml
            .github/workflows/pr-update-playwright-expectations.yaml
          )
          if [[ -f scripts/start-comfyui-e2e.sh ]]; then
            files+=(scripts/start-comfyui-e2e.sh)
          fi
          sed -E -i \
            "s|(ghcr.io/comfy-org/comfyui-ci-container:)[0-9]+\.[0-9]+\.[0-9]+|\1${VERSION}|g" \
            "${files[@]}"
          if [[ -x scripts/cicd/check-comfyui-container-version.sh ]]; then
            scripts/cicd/check-comfyui-container-version.sh
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.FRONTEND_PAT }}
          branch: automation/ci-container-${{ steps.version.outputs.version }}
          title: "chore: bump CI container to ${{ steps.version.outputs.version }}"
          body: |
            Updates CI container from `${{ steps.current.outputs.current_version }}` to `${{ steps.version.outputs.version }}`

            **Triggered by:** [Tag v${{ steps.version.outputs.version }}](${{ github.server_url }}/${{ github.repository }}/tree/v${{ steps.version.outputs.version }})
          labels: automation
          commit-message: "chore: bump CI container to ${{ steps.version.outputs.version }}"
