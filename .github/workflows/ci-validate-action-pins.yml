name: Validate Action Pins

on:
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
      - '.pinact.yaml'
  merge_group:
  push:
    branches: [main]
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
      - '.pinact.yaml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: 'false'
